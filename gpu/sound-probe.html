<!doctype html>
<title>sound probe</title>
<body style="font: 14px sans-serif; margin: 24px">
<h2>Sound probe</h2>
<p id="out"></p>
<script>
const out = document.getElementById('out');
function log(s) { out.innerHTML += s + '<br>'; console.log('SOUNDPROBE ' + s); }

// 1. WebAudio: a 440 Hz tone for 3 s, then a 660 Hz tone for 1 s.
const ctx = new AudioContext();
log('AudioContext sampleRate=' + ctx.sampleRate + ' state=' + ctx.state +
    ' baseLatency=' + ctx.baseLatency.toFixed(4) +
    ' outputLatency=' + (ctx.outputLatency || 0).toFixed(4));
function tone(freq, start, dur) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  g.gain.value = 0.3;
  o.frequency.value = freq;
  o.connect(g).connect(ctx.destination);
  o.start(start);
  o.stop(start + dur);
}
tone(440, ctx.currentTime + 0.2, 3);
tone(660, ctx.currentTime + 3.4, 1);
ctx.resume().then(() => log('resumed state=' + ctx.state));
setTimeout(() => log('after 2 s: state=' + ctx.state + ' currentTime=' +
                     ctx.currentTime.toFixed(2)), 2000);

// 2. An <audio> element with a generated 1 s 880 Hz WAV, played after the tones.
function wav(freq, seconds, rate) {
  const n = seconds * rate, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true);
  v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(2 * Math.PI * freq * i / rate) * 8000, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
const a = new Audio(wav(880, 1, 44100));
a.onplaying = () => log('audio element playing');
a.onended = () => log('audio element ended');
a.onerror = () => log('audio element error ' + (a.error && a.error.code));
setTimeout(() => a.play().catch(e => log('play() rejected: ' + e)), 5000);
</script>
